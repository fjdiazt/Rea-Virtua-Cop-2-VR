; VC2VR.ini - VR side. Put next to VC2VR.exe.

[vr]

; Console menu before launching: --menu also opens it. Edits save immediately.
menu = 0

; Desktop debug modes. Both 0 = headset; stereo wins if both are 1.
; --window and --stereo override these for one run.
window = 0
stereo = 0

; Optional EU/PAL cheats for both players. CLI flags enable them for one run.
infinite_ammo = 0
infinite_lives = 0

; Depth buffer from the engine's own sort keys. Keep 1.
depth = 1
depthbias = 3

; Gun in the hand: a Wavefront OBJ next to the exe, scale in percent.
gunmodel = gun.obj
gunscale = 100

; Second controller as player 2 (also akimbo = 1 in HGL_VIEW.ini). 0 = one gun.
akimbo = 1

; Picture: MSAA samples, eye buffer size in percent, gamma in percent.
msaa = 4
supersample = 140
gamma = 220

; Zoom: magnification cap in percent, follow the game's own zoom.
zoom = 400
autozoom = 1

; Where the laser ends when it hits nothing, metres.
aimreach = 6

; Recoil buzz.
haptic = 1

; Optional CD-check bypass when VC2VR launches a recognized game executable.
; In memory only; a mounted disc is still needed for music.
launchfix = 0
